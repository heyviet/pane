name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Browser input regression tests
        run: node --test tests/keys.test.cjs tests/mirror-input.test.cjs
      - name: Check browser script syntax
        shell: pwsh
        run: |
          Get-ChildItem handset/web -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
